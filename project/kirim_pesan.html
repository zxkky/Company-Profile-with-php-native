<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Comment</title>
    <!-- Include the Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Customize your styles here */
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-md p-8 max-w-md w-full">
        <h2 class="text-xl font-bold mb-4">Send Comment</h2>
        <form action="#" method="POST">
            <div class="mb-4">
                <label for="comment" class="block text-gray-600 font-bold mb-2">Comment:</label>
                <textarea id="comment" name="comment" rows="4" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <div class="text-right">
                <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded-md">Send</button>
            </div>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan Peta dengan Leaflet.js</title>
    <!-- Tambahkan tautan ke Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tambahkan tautan ke Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- Tentukan gaya untuk elemen peta -->
    <style>
        /* Gaya untuk elemen peta */
        #map {
            height: 350px; /* Sesuaikan tinggi sesuai kebutuhan Anda */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Peta dengan Leaflet.js</h1>
        <!-- Kontainer untuk peta -->
        <div id="map"></div>
    </div>

    <!-- Tambahkan tautan ke Bootstrap JavaScript dan Popper.js -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Tambahkan tautan ke Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Inisialisasi peta
        var mymap = L.map('map').setView([-75.246770, 17.244518], 2); // Koordinat Antartika

        // Tambahkan tile layer (misalnya, OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(mymap);

        // Tambahkan marker ke peta
        L.marker([-75.246770, 17.244518]).addTo(mymap)
            .bindPopup('Lokasi Anda di sini').openPopup();
    </script>
</body>
</html>
